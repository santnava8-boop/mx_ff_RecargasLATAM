<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="50b5e756b145ec11f24d026673d2d26e">
    <title>Recargas Free Fire México</title>
    <style>
        :root {
            --primary: #ff4500;
            --dark: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #25d366;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: var(--text);
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Recargas Free Fire México</h1>
        <p class="subtitle">Página web de recargas de Free Fire 100% seguras libre de reembolso</p>
    </div>
</body>
</html>
